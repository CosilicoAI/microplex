[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microplex"
version = "0.2.0"
description = "Microdata synthesis and reweighting using normalizing flows"
readme = "README.md"
license = "MIT"
authors = [
    { name = "PolicyEngine", email = "hello@policyengine.org" }
]
keywords = [
    "microdata",
    "synthesis",
    "normalizing-flows",
    "survey-data",
    "privacy",
    "imputation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyarrow>=14.0",  # For parquet file support
    "huggingface_hub>=0.20",  # For PUF download
    "polars>=0.20",  # For CPS loading
    "httpx>=0.25",  # For data downloads
    "h5py>=3.0",  # For array-style HDF5 source datasets
    "pyyaml>=6.0",  # For configuration files
    "microimpute>=3.1.1 ; python_version >= '3.12' and python_version < '3.15'",  # Canonical regime-gated donor imputation
    "quantile-forest>=1.3",  # For QRF-based synthesis
    "scikit-learn>=1.3",  # For classification in zero-inflated models
    "pydantic>=2.0",  # For data models
    "prdc>=0.1",  # Canonical PRDC metrics (Naeem et al. 2020)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "responses>=0.20",
]
cvxpy = [
    "cvxpy>=1.3",
]
statmatch = [
    # "py-statmatch>=0.1.0",  # Statistical matching backend (not on PyPI yet)
]
l0 = [
    "l0-python>=0.4",  # L0 regularization for HardConcreteCalibrator
]
calibrate = [
    # Identity-preserving gradient-descent chi-squared adapter.
    # microcalibrate pins Python >=3.13; the marker avoids breaking
    # microplex installs on 3.12 that don't need the extra.
    "microcalibrate>=0.22; python_version >= '3.13'",
]
benchmark = [
    "sdv>=1.0",  # CT-GAN, TVAE, Copulas
    "scikit-learn>=1.3",  # For QRF comparison
    "matplotlib>=3.7",
    "seaborn>=0.12",
]
docs = [
    "jupyter-book>=0.15,<2",
    "sphinx>=6.0",
    "myst-nb>=0.17",
    "sphinx-autodoc-typehints>=1.23",
]
all = [
    "microplex[dev,benchmark,docs,calibrate]",
]

[project.urls]
Homepage = "https://github.com/PolicyEngine/microplex"
Documentation = "https://policyengine.github.io/microplex"
Repository = "https://github.com/PolicyEngine/microplex"

[project.scripts]
microplex-check-content-package = "microplex.content_package:main"
microplex-us-asec-puf-smoke = "microplex.data_sources.asec_puf_smoke:main"
microplex-us-source-impute-smoke = "microplex.data_sources.source_impute:main"

[tool.uv.sources]
microimpute = { git = "https://github.com/PolicyEngine/microimpute.git", rev = "90be828eb442c48ee86bb91bb83a75da4b0f0f89" }

[tool.hatch.build.targets.wheel]
packages = ["src/microplex"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line length handled by formatter

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
